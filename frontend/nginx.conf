# Auslieferung des gebauten Frontends (frontend/dist) plus /api-Proxy auf das
# Rust-Backend. Ersetzt fuer den Betrieb den Vite-Proxy aus vite.config.ts.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json
               image/svg+xml application/manifest+json;

    # Healthcheck-Antwort ohne Zugriff aufs Dateisystem.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Sourcemaps sind bewusst nicht oeffentlich (build.sourcemap = true).
    location ~* \.map$ {
        return 404;
    }

    # /api/ -> Backend. Der Name "backend" ist der Compose-Service.
    #
    # Ueber eine Variable mit resolver statt proxy_pass direkt auf den Namen:
    # so startet nginx auch, wenn der Backend-Container noch nicht laeuft -
    # der Hostname wird erst beim Request aufgeloest (127.0.0.11 = Docker-DNS).
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Ohne abschliessenden Slash, damit auch "/api" nicht im SPA-Fallback
    # landet (die Oberflaeche ruft aber ohnehin nur "/api/...").
    location /api {
        set $backend "http://backend:3000";
        # Enthaelt $backend keinen Pfad, reicht nginx den Originalpfad durch.
        proxy_pass $backend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Dateien mit Hash im Namen (assets/index-DmStSLly.js) sind unveraenderlich.
    # Nur add_header, kein expires - sonst schickt nginx zwei Cache-Control.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA-Fallback: /connectfour/:id usw. liefert index.html.
    # index.html selbst nicht cachen, sonst haengen alte Asset-Hashes drin.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
